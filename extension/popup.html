<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随手回</title><link rel="stylesheet" href="popup.css"><body>
<div class="brand">随手回 <span>EDGE · 1.2</span></div><h1>让讨论，多一点自己的看法。</h1>
<p>打开 X 帖子详情页，在页面旁的随手回面板生成和编辑草稿。</p>
<label class="toggle"><input id="auto" type="checkbox"> 自动生成自然回复</label>
<p class="note">开启后，前台当前帖子的正文将发送给 DeepSeek，可能产生 API 费用。只生成草稿，不填入或发送。</p>
<p id="status" role="status"></p>
<ol><li>先解压完整安装包，运行 <b>Install.cmd</b>。</li><li>在原随手回桌面应用中保存 DeepSeek 密钥。</li><li>审阅草稿后复制，手动粘贴进 X 回复框。</li></ol>
<p class="note">密钥保留在 Windows 凭据管理器。网页识别不确定时，可在面板粘贴原帖。扩展不读取其他网站。</p>
<script src="popup.js"></script></body></html>
